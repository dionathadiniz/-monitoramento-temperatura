
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Temperatura</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Monitoramento de Temperatura</h1>
        <h2>Raspberry Pi + Arduino</h2>

        <div class="card">
            <h3>Temperatura Atual</h3>
            <p class="temperatura" id="temperatura">-- °C</p>
            <p id="status">Aguardando dados...</p>
        </div>

        <p class="status">Sistema de monitoramento</p>
    </div>

    <script>
        async function atualizarTemperatura() {
            const temperaturaElemento =
                document.getElementById('temperatura');

            const statusElemento =
                document.getElementById('status');

            try {
                const resposta = await fetch('/temperatura');

                if (!resposta.ok) {
                    throw new Error('Erro ao buscar temperatura');
                }

                const dados = await resposta.json();

                if (dados.temperatura === null) {
                    temperaturaElemento.innerText = '-- °C';
                } else {
                    temperaturaElemento.innerText =
                        dados.temperatura + ' °C';
                }

                if (dados.status === 'real') {
                    statusElemento.innerText =
                        'Status: Dados recebidos do Arduino';
                } else if (dados.status === 'simulado') {
                    statusElemento.innerText =
                        'Status: Temperatura simulada';
                } else if (dados.status === 'erro') {
                    statusElemento.innerText =
                        'Status: Erro na leitura do sensor';
                } else {
                    statusElemento.innerText =
                        'Status: Desconhecido';
                }

            } catch (erro) {
                temperaturaElemento.innerText = '-- °C';
                statusElemento.innerText =
                    'Erro ao receber dados do servidor';
            }
        }

        atualizarTemperatura();

        setInterval(atualizarTemperatura, 3000);
    </script>
</body>
</html>
